---
name: Workflow lint

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint, ShellCheck and shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443 objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        run: script/install_tools.sh actionlint shellcheck shfmt
      # actionlint runs ShellCheck, with every optional check, on every run: block of the workflows;
      # the scripts and the pre-commit hook are checked directly.
      - run: script/check actionlint shellcheck shfmt

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        run: script/install_tools.sh zizmor
      # The pedantic persona with the online audits (impostor commits, ref confusion, known
      # vulnerable actions), which read the GitHub API with the job's read-only token.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/check zizmor

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [actionlint, zizmor]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate
        run: script/warning_gate.sh
