name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 6 * * 1'

# Scorecard's publish-results validation requires top-level read-only permissions.
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Scorecard Analysis
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the OpenSSF REST API (for the public badge) has
          # strict workflow-validation requirements that reject this run;
          # results still land in the repo's code-scanning dashboard via the
          # SARIF upload below. Flip to true once the badge is wanted.
          publish_results: false

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
