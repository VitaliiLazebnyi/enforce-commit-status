---
name: Security

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --throw-deprecation

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      # Every package resolves to registry.npmjs.org, no dependency has a known vulnerability of any
      # severity, and every registry signature and provenance attestation verifies.
      - run: script/check audit

  scorecard:
    name: OpenSSF Scorecard of the dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 api.scorecard.dev:443 github.com:443 nodejs.org:443
            objects.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      # Every package of package-lock.json must come from a repository scoring at least the
      # threshold of script/scorecard.json, unless that file allows it with a reason.
      - run: script/check scorecard

  # Requires the repository's Dependency graph to be enabled (Settings > Code security).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post the dependency review summary on the pull request
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Any known vulnerability, of any severity, in any kind of dependency (runtime,
          # development or of unknown scope) fails the review.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: on-failure
          # The OpenSSF Scorecard check of the dependencies is the `scorecard` job above: this
          # action can only warn on every package under one global threshold, while that job
          # applies the same threshold to the whole dependency tree with documented per-package
          # allowances (script/scorecard.json).
          show-openssf-scorecard: false

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443 objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned tools
        run: script/install_tools.sh gitleaks
      # The full history, not only the checked-out tree.
      - run: script/check gitleaks

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [npm-audit, scorecard, dependency-review, gitleaks]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate
        run: script/warning_gate.sh
