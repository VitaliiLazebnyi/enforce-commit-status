---
name: CodeQL

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 30 5 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }}, ${{ matrix.suite }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads workflow metadata
      contents: read
      security-events: write # upload CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
        suite: [security-extended, security-and-quality]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443 uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.suite }}
          build-mode: none
          # Both suites of a language extract the same commit and would race to save the same TRAP
          # cache key; the loser logs "Unable to reserve cache", which the warning gate rejects.
          trap-caching: false
          # dist/ is the bundle ncc (webpack) generates from src/ and node_modules/: its alerts are
          # in webpack's module wrappers and third-party code. src/ is analyzed, and CI proves dist/
          # is a byte-identical rebuild of it.
          config: |
            paths-ignore:
              - dist
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}/suite:${{ matrix.suite }}

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [analyze]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate
        run: script/warning_gate.sh
