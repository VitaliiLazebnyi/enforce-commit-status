---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing is writable by default; every job re-declares the (read-only) permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deprecations of Node.js APIs fail the process that hits them.
  NODE_OPTIONS: --throw-deprecation

# Every job runs its checks through script/check, the same script a local run uses. Each job blocks
# all network egress except the endpoints it lists (step-security/harden-runner).
jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version || 'runtime' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Node.js 24 of .node-version: the action's node24 runtime.
          - node-version: ''
          # The newest Node.js release.
          - node-version: 26.13.0
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.node-version' || '' }}
      - name: Install npm and the locked dependencies
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: script/setup_npm.sh ${NODE_VERSION:+"${NODE_VERSION}"}
      # Vitest enforces 100% line, branch, function and statement coverage; any Node.js process
      # warning fails the run (test/setup/warnings-as-errors.ts).
      - run: script/check test

  lint:
    name: Lint, format, suppressions, unused code, duplication
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      - run: script/check eslint prettier suppressions knip duplication

  typecheck:
    name: TypeScript (strict)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      - run: script/check typecheck

  dist:
    name: dist/ is a clean rebuild of src/
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      # Rebuilds dist/, fails when it differs from the committed bundle, then runs the bundle: with
      # an invalid token it must fail closed with an ::error annotation.
      - run: script/check dist

  # Every dependency, Action and tool must be at its newest release, except the documented holds
  # of script/outdated.json, which state why each one is held.
  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443
            pypi.org:443 raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      - run: script/check outdated

  # Spelling, Markdown, YAML and EditorConfig: every text file of the repository.
  text:
    name: Spelling, Markdown, YAML, EditorConfig
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            files.pythonhosted.org:443 github.com:443 objects.githubusercontent.com:443 pypi.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        run: script/install_tools.sh typos rumdl yamllint editorconfig-checker
      - run: script/check typos markdown yaml editorconfig

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [test, lint, typecheck, dist, outdated, text]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate
        run: script/warning_gate.sh
