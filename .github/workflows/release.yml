---
name: Release

# Verifies that the commit a release tag points to passes every check of script/check (including
# mutation testing and the byte-identical rebuild of dist/), then publishes a GitHub release.
'on':
  push:
    tags:
      - v*

permissions: {}

# Never cancel a release in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --throw-deprecation

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 api.scorecard.dev:443 files.pythonhosted.org:443 github.com:443
            nodejs.org:443 objects.githubusercontent.com:443 pypi.org:443
            raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: a poisoned cache must never reach a check or a release.
          package-manager-cache: false
          node-version-file: .node-version
      - name: Install npm and the locked dependencies
        run: script/setup_npm.sh
      - name: Install the pinned tools
        run: >-
          script/install_tools.sh actionlint editorconfig-checker gitleaks rumdl shellcheck shfmt
          typos yamllint zizmor
      - name: Every check
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/check

  release:
    name: Publish the GitHub release
    needs: [verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release for the verified tag
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 uploads.github.com:443
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi

  warning-gate:
    name: Warning gate (Release)
    if: ${{ !cancelled() }}
    needs: [verify, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate (Release)
        run: script/warning_gate.sh
